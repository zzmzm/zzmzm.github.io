# Tiyi declarative resource template
# Replace the example values, verify `crsRulesetRef` with `tiyi crs list`, then:
#   tiyi diff -f apply.yaml
#   tiyi apply -f apply.yaml
# Specs replace all apply-managed fields; they are not merge patches.

apiVersion: tiyi.io/v1
kind: Policy
metadata:
  name: app-baseline
spec:
  engineState: on          # on | detection_only | off
  blockingMode: anomaly    # anomaly | self_contained
  crsRulesetRef: "4.25.1" # existing CRS ID or version
  status: active           # draft | active | archived
---
apiVersion: tiyi.io/v1
kind: Upstream
metadata:
  name: app-pool
spec:
  backends:
    - url: http://127.0.0.1:9000
      weight: 100
  loadBalance: round_robin
  healthCheck:
    path: "" # empty disables active probes
    method: GET
    expectedStatus: 200
    intervalSeconds: 30
    timeoutSeconds: 5
    unhealthyThreshold: 3
    healthyThreshold: 2
    followRedirects: false
    expectedBody: ""
    host: ""
  status: active
---
apiVersion: tiyi.io/v1
kind: Site
metadata:
  name: app-example
spec:
  primaryHost: app.example.com
  aliases: [www.app.example.com]
  upstreamRef: app-pool # or upstreamsInline; never both
  tls:
    mode: none # none | uploaded | managed_acme
  waf:
    enabled: true
    policyRef: app-baseline
    mode: blocking
  status: active
---
apiVersion: tiyi.io/v1
kind: IpList
metadata:
  name: office-addresses
spec:
  description: Trusted office egress addresses
  entries:
    - cidr: 203.0.113.0/24
      description: Primary office
    - cidr: 2001:db8:100::/48
      description: Primary office IPv6
      expireAt: 2026-12-31T00:00:00Z

# Applying an IpList does not enforce it; create a separate binding. geo:* is
# rejected—use Protection > Country Access for country enforcement.
